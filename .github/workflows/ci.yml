name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      # STRAPI_URL sengaja kosong: build memakai src/data/fixture.json, jadi CI tidak bergantung pada CMS yang hidup.
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  cms-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./cms
      - run: docker build ./api
